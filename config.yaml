# TTS Screen Reader - Text Filter Rules
# Lines matching any of these patterns will be removed before reading aloud.
# Uses Python regex. Case-insensitive by default.
#
# Add your own rules below. Each rule is a regex pattern string.

skip_patterns:
  # Copyright notices
  - "©\\s*\\d{4}"
  - "copyright\\s+\\(c\\)"
  - "all rights reserved"
  - "copyright\\s+\\d{4}"
  - "©"

  # Page counts / page numbers
  - "^\\s*page\\s+\\d+\\s*(of\\s+\\d+)?\\s*$"
  - "^\\s*\\d+\\s*/\\s*\\d+\\s*$"
  - "^\\s*\\[\\d+\\]\\s*$"

  # Slide number indicators
  - "^\\s*\\d+\\s*/\\d+\\s*$"

  # Common footer noise
  - "^\\s*confidential\\s*$"
  - "^\\s*draft\\s*$"
  - "^\\s*do not distribute\\s*$"

  # Watermarks
  - "^\\s*sample\\s*$"
  - "^\\s*watermark\\s*$"

# Minimum line length — lines shorter than this (in characters) are skipped
# unless they end with sentence punctuation (.!?).
min_line_length: 4