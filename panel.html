<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
      min-height: 100vh;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #e8e8e8;
    }
    .subtitle {
      font-size: 11px;
      color: #667;
      margin-bottom: 14px;
    }
    .status {
      font-size: 11px;
      margin-bottom: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #16213e;
      color: #8892b0;
    }
    .status.ok { color: #64ffda; }
    .status.err { color: #ff6b6b; }
    .section-label {
      font-size: 11px;
      color: #8892b0;
      margin-bottom: 4px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-label .hint {
      font-size: 10px;
      color: #445;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }
    #btn-read {
      background: linear-gradient(135deg, #0f3460, #1a4a8a);
      color: #64ffda;
    }
    #btn-read:hover:not(:disabled) { filter: brightness(1.2); transform: scale(1.02); }
    #btn-read:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #btn-read.playing {
      background: linear-gradient(135deg, #2a1a1a, #3a1a1a);
      color: #ff6b6b;
    }
    .voice-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .voice-row label {
      font-size: 12px;
      color: #8892b0;
      white-space: nowrap;
    }
    select {
      flex: 1;
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      resize: vertical;
      min-height: 80px;
      max-height: 300px;
      line-height: 1.4;
    }
    textarea:focus {
      outline: none;
      border-color: #1a4a8a;
    }
    textarea::placeholder {
      color: #445;
    }
    .ocr-text {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #99a;
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.4;
      display: none;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .error-msg {
      font-size: 11px;
      color: #ff6b6b;
      margin-top: 6px;
      display: none;
      line-height: 1.4;
    }
    .info {
      font-size: 10px;
      color: #445;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>&#128264; TTS Screen Reader</h1>
  <div class="subtitle">Screenshot → OCR → Read aloud</div>
  <div class="status" id="status">Checking server...</div>
  <button id="btn-read">&#128247; Read My Screen</button>
  <div class="voice-row">
    <label>Voice:</label>
    <select id="voice">
      <option value="af_bella">Bella (US &#9792;)</option>
      <option value="af_nicole">Nicole (US &#9792;)</option>
      <option value="af_sarah">Sarah (US &#9792;)</option>
      <option value="af_sky">Sky (US &#9792;)</option>
      <option value="am_adam">Adam (US &#9794;)</option>
      <option value="am_michael">Michael (US &#9794;)</option>
      <option value="bf_emma">Emma (UK &#9792;)</option>
      <option value="bf_isabella">Isabella (UK &#9792;)</option>
      <option value="bm_george">George (UK &#9794;)</option>
      <option value="bm_lewis">Lewis (UK &#9794;)</option>
    </select>
  </div>

  <div class="section-label">
    <span>Constraints</span>
    <span class="hint">appended to OCR prompt</span>
  </div>
  <textarea id="constraints" placeholder="e.g. Skip all headers and footers&#10;Only read the main paragraph text&#10;Ignore red text"></textarea>

  <div class="section-label"><span>OCR Output</span></div>
  <div class="ocr-text" id="ocr-text"></div>
  <div class="error-msg" id="error"></div>
  <div class="info">Requires kokoro_server.py on port 5912</div>
  <script src="panel.js"></script>
</body>
</html>
