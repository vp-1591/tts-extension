name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Torch-free install: tests stub torch; skips the multi-GB CUDA wheel.
      # --locked fails if uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --no-install-package torch

      - name: Lint (ruff)
        run: uv run --no-sync ruff check kokoro_server.py native_host/ tests/

      - name: Type check (pyright)
        run: uv run --no-sync pyright

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: uv run --no-sync pytest tests/ -v
