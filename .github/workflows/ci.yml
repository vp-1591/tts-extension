name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install kokoro soundfile ruff pytest

      - name: Lint (ruff)
        run: ruff check kokoro_server.py native_host/ tests/

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: pytest tests/ -v --ignore=tests/e2e